<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input,
        button {
            padding: 5px;
            border: 1px solid grey;
            border-radius: 6px;
        }
        .content{
            display: block;
            margin-left: 45vw;
            margin-top: 50vh;
        }
        input::placeholder{
            text-align: center;
            align-items: center;
            font-weight: 600;
            font-size: 10.3px;
        }
        button{
            cursor: pointer;
        }
        #campo{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin-top: 2%;
            width: 200px;
            height: 100px;
            border: 1px solid grey;
            border-radius: 10px;
            padding: 5px 0 0 10px;
        }
    </style>
</head>

<body>

    <main class="content">

        <input type="text" id="Num" placeholder="Digite o numero para ver o fatorial">
        <button onclick="Ver()">Ver</button>

        <div id="campo"></div>
    </main>

    <script src="script.js"></script>
</body>

</html>
