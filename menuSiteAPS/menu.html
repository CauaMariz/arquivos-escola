<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #BtnMenu {
            position: absolute;
            display: flex;
            background-color: rgb(0, 132, 255);
            border: 0.5px solid grey;
            border-radius: 4px;
            padding: 5px;
            border-top-left-radius: 0;
            color: white;
        }

        .menu {
            background-color: rgb(0, 132, 255);
            border-radius: 7px;

        }

        .AddMenu {
            transition: 0.6s;
            width: 8vw;
            height: 90vh;
            opacity: 1;
            line-height: 20px;
            border-top-right-radius: 0;
            border-top-left-radius: 0;
        }


        .RmvMenu {
            transition: 0.6s;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .carrinho {
            display: flex;
            position: relative;
            margin-left: 20%;
            top: 10vh;
            transition: 0.5s;
        }

        .home {
            display: flex;
            padding-top: 30%;
            margin-left: 21%;
            transition: 0.5s;
        }

        .login {
            display: flex;
            position: relative;
            top: 32vh;
            margin-left: 21%;
            transition: 0.5s;
        }

        .gato {
            display: flex;
            position: relative;
            top: 8vh;
            margin-left: 21%;
            transition: 0.5s;
        }

        .osso {
            display: flex;
            position: relative;
            top: 31vh;
            margin-left: 21%;
            transition: 0.5s;
        }

        .config {
            display: flex;
            position: relative;
            top: 40vh;
            margin-left: 21%;
            transition: 0.5s;
        }

        .login:hover {
            transition: 0.5s;
            scale: 1.1;
        }

        .carrinho:hover {
            transition: 0.5s;
            scale: 1.1;
        }

        .home:hover {
            transition: 0.5s;
            scale: 1.1;
        }

        .osso:hover {
            transition: 0.5s;
            scale: 1.1;
        }

        .gato:hover {
            transition: 0.5s;
            scale: 1.1;
        }

        .config:hover {
            transition: 0.5s;
            scale: 1.1;
        }
    </style>
</head>

<body>

    <div class="menu"></div>

    <button onclick="VerMenu()" id="BtnMenu" style="cursor: pointer;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-list"
            viewBox="0 0 16 16">
            <path fill-rule="evenodd"
                d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5" />
        </svg>
    </button>

    <script src="sriptMenu.js"></script>



</body>

</html>
