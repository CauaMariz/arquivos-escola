<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            background-color: rgb(237, 237, 237);

        }

        form {
            width: 40px;
            padding-bottom: 1vw;
            min-width: 400px;
            height: auto;
            min-height: 400px;
            display: block;
            justify-content: center;
            background-color: rgb(219, 219, 219);
            align-content: center;
            margin: 0 auto;
            border-radius: 15px;
            box-shadow: 1px 1px 6px 1px rgb(237, 237, 237);

        }

        form input,
        button {
            justify-self: center;
            display: block;
            align-items: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        form input {
            width: 200px;
            padding: 7px;
            border-radius: 6px;
            border: 1px solid rgb(82, 82, 82);
            margin-bottom: 2vw;
        }

        form button {
            padding: 3px;
            border-radius: 12px;
            border: 1px solid grey;
            background-color: rgb(77, 255, 0);
            cursor: pointer;
            width: 215px;
            font-size: 18px;
        }

        form h3 {
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 45px;
            color: rgb(255, 255, 255);
        }

        .paragrfs {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .paragrfs p {
            display: flex;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: rgb(39, 39, 39);
            gap: 50px;
            cursor: pointer;
        }

        .paragrfs2 {
            display: flex;
            gap: 70px;
        }
        
        .paragrfs input {
            width: 15px;
            margin-top: 2.3vw;
            transition: .4s;
        }
        .paragrfs p:hover{
            transition: .4s;
            color: black;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <form action="teste.php" method="post">
        <h3>Login</h3>

        <input type="text" name="nomeUser" required placeholder="Nome: ">
        <input type="email" name="emailUser" required placeholder="Email: ">
        <input type="password" name="senhaUser" required placeholder="Senha: ">


        <div class="paragrfs">
            <div class="paragrfs2">
                <p>Esqueceu sua senha?</p>
                <p>Lembrar de mim</p>
            </div>
            <input type="checkbox">
        </div>

        <button type="submit">Cadastrar</button>
    </form>

</body>

</html>
