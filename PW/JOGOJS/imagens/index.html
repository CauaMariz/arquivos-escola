<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        class Nave{
            constructor (contexto,img){
                this.contexto=contexto;
                this.img=img;
                this.x=0;
                this.y=350;
                this.destino=0;

            }
            apagar(){
                this.contexto.clearRect(this.x,this.y,35,44)
            }
            desenhar(){
                this.contexto.drawImage(this.img,this.x,this.y)
            }
            mover(){}
            posicao(x){}
        }

        function iniciar() {
            let canvas = document.querySelector("#MyCanvas");
            let contexto = canvas.getContext("2d");
            let img = document.querySelector("#nave");

            contexto.drawImage(img, 550, 350);
            img = document.querySelector("#inimigo1");
            contexto.drawImage(img, 150, 150)
        }
        function moveNave(event) {
            /*
            console.log("Vertical" + event.offsetY)
            console.log("Hrizontal" + event.offsetX)
            */

            let canvas = document.querySelector("#MyCanvas");
            let contexto = canvas.getContext("2d");
            let img = document.querySelector("#nave");

            contexto.drawImage(img, event.offsetX,event.offsetY);
        }
    </script>

</head>

<body style="background-color: black;" onload="iniciar()">
    <canvas id="MyCanvas" width="600" height="400" style="background-color: aliceblue; border: 1px solid black;"
        onmousemove="moveNave(event)">

    </canvas>
    <img src="imgs/nave.png" alt="" id="nave">
    <img src="imgs/inimigo-fase1.png" alt="" id="inimigo1">

</body>

</html>
